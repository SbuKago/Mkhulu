<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mkhulu's Kitchen Menu</title>
    <style>
        /* ================= LAYOUT FIX ================= */
        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
            background: #111;
            /* This ensures the menu doesn't go under the side cart on desktop */
            padding-right: 420px;
            transition: padding 0.3s ease;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .brand-header {
            display: flex;
            align-items: center;
            justify-content: center;
            /* Centers the whole logo/text block */
            gap: 20px;
            /* Space between logo and text */
            margin-bottom: 5px;
            color: #F6EDBF;
        }

        .logo {
            width: 60px;
            /* Adjust size as needed */
            height: 60px;
            object-fit: contain;
            /* Keeps the logo from stretching */
            border-radius: 50%;
            /* Optional: makes the logo circular */
        }

        /* Adjust h1 margin since the container now handles spacing */
        h1 {
            margin: 0;
        }

        /* ================= PROFESSIONAL SIDE CART ================= */
        #cart-pnl {
            position: fixed;
            top: 0;
            right: 0;
            width: 420px;
            height: 100vh;
            background: #1c1c1c;
            box-shadow: -8px 0 30px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            z-index: 1000;
            color: #fff;
            border-left: 2px solid #ffbb00;
            font-size: 14px;
        }

        .cart-header {
            padding: 20px;
            font-size: 1.4rem;
            font-weight: 700;
            background: #111;
            border-bottom: 1px solid #333;
            color: #ffbb00;
        }

        #cart-items-list {
            flex: 1;
            overflow-y: auto;
            padding: 15px 20px;
        }

        .cart-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #333;
        }

        .checkout-section {
            padding: 20px;
            background: #222;
            border-top: 1px solid #333;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .details-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .details-form input,
        .details-form select {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #1c1c1c;
            color: #fff;
            width: 100%;
            box-sizing: border-box;
        }

        .full-width {
            grid-column: span 2;
        }

        .btn-whatsapp {
            background: linear-gradient(135deg, #25D366, #1ebe5d);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 40px;
            font-weight: 700;
            cursor: pointer;
        }

        .total-display {
            display: flex;
            justify-content: space-between;
            font-weight: 700;
            font-size: 1.2rem;
            color: #ffbb00;
            padding-top: 10px;
            border-top: 2px solid #333;
        }

        /* ================= MENU ITEMS ================= */
        h2 {
            margin-top: 30px;
            color: #F6EDBF;
            border-bottom: 2px solid #ffbb00;
            display: inline-block;
        }

        .item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: white;
            margin-bottom: 8px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .item-name {
            flex: 1;
            font-weight: 600;
            color: #333;
        }

        .price {
            font-weight: bold;
            color: #e67e22;
            margin: 0 15px;
        }

        .add-btn {
            background: #ffbb00;
            color: #111;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .add-btn:active {
            transform: scale(0.9);
        }

        /* ================= RESPONSIVE FIX ================= */
        @media (max-width: 900px) {
            body {
                padding-right: 0;
                /* Remove side padding */
                padding-bottom: 50vh;
                /* Add bottom padding so menu isn't hidden by bottom cart */
            }

            #cart-pnl {
                width: 100%;
                height: 50vh;
                /* Shorter height for mobile */
                top: auto;
                bottom: 0;
                border-left: none;
                border-top: 3px solid #ffbb00;
            }
        }

        /* Remove Button Styling */
        .remove-btn {
            background: #ff4444;
            color: white;
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s ease;
        }

        .remove-btn:hover {
            background: #cc0000;
            transform: scale(1.1);
        }

        /* Ensure the cart row keeps things aligned with the new button */
        .cart-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #333;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="brand-header">
            <img src="images/LOGO.avif" alt="Mkhulu's Logo" class="logo">
            <h1>Mkhulu's on main</h1>
        </div>
        <p class="subtitle"></p>
        <div id="menu-sections"></div>
    </div>

    <div id="cart-pnl">
        <div class="cart-header">🛒 Your Order</div>
        <div id="cart-items-list"></div>
        <div class="checkout-section">
            <div class="details-form">
                <input type="text" id="cust-name" placeholder="Name & Surname *" required>
                <input type="tel" id="cust-phone" placeholder="Phone Number *" required>
                <select id="order-type">
                    <option value="Collection">Collection</option>
                    <option value="Delivery">Delivery</option>
                </select>
                <input type="text" id="order-time" placeholder="Time (Optional)">
                <input type="text" id="cust-address" class="full-width" placeholder="Delivery Address (Optional)">
            </div>
            <button class="btn-whatsapp" onclick="sendToWhatsApp()">🚀 Send Order via WhatsApp</button>
            <div class="total-display">
                <span>Total</span>
                <span>R<span id="total-val">0.00</span></span>
            </div>
        </div>
    </div>

    <script>
        // ... (Keep your existing script exactly as it was) ...
        const fullMenu = [
            {
                cat: "🌯 Spaykos & Amagwinya", items: [
                    { n: "Small Spaykos", p: 15 }, { n: "Medium Spaykos", p: 40 },
                    { n: "Large Spaykos", p: 80 }, { n: "Mkhulu’s Spaykos", p: 120 },
                    { n: "Regular Gwinya (Small)", p: 1 }, { n: "Regular Gwinya (Small + Mince)", p: 3 },
                    { n: "Regular Gwinya (Big)", p: 7 }, { n: "Regular Gwinya (Big + Mince)", p: 10 }
                ]
            },
            {
                cat: "🍕 Pizza", items: [
                    { n: "Chicken Pizza (M)", p: 70 }, { n: "Chicken Pizza (L)", p: 120 },
                    { n: "Salami Pizza (M)", p: 70 }, { n: "Salami Pizza (L)", p: 120 },
                    { n: "Hawaiian Pizza (M)", p: 70 }, { n: "Hawaiian Pizza (L)", p: 120 },
                    { n: "Beef Pizza (M)", p: 80 }, { n: "Beef Pizza (L)", p: 140 },
                    { n: "Vegetarian Pizza (M)", p: 60 }, { n: "Vegetarian Pizza (L)", p: 100 },
                    { n: "Extra Cheese", p: 15 }
                ]
            },
            {
                cat: "🍔 Burgers & Fast Food", items: [
                    { n: "Fatcake Burger: Prego", p: 40 }, { n: "Fatcake Burger: Rib", p: 50 }, { n: "Fatcake Burger: Beef", p: 40 },
                    { n: "Mini Cooper (Russian/Cheese)", p: 40 }, { n: "Range Rover", p: 45 },
                    { n: "Porsche", p: 50 }, { n: "Audi RS7", p: 60 }, { n: "Lamborghini", p: 70 },
                    { n: "Bugatti", p: 75 }, { n: "Rolls Royce", p: 90 }
                ]
            },
            {
                cat: "🥩 Grills & Mains", items: [
                    { n: "Oxtail with Mash/Rice", p: 160 }, { n: "Beef Stew with Samp/Pap", p: 80 },
                    { n: "Chicken Fillet with Chips/Salad", p: 80 }, { n: "Lamb Chop with Chips/Veg", p: 120 },
                    { n: "Steak with Chips/Veg", p: 120 }, { n: "400g Sparerib and Chips", p: 120 },
                    { n: "1kg Sparerib and Chips", p: 200 }, { n: "4 Buffalo Wings & Chips", p: 110 },
                    { n: "8 Crumbed Wings & Chips", p: 110 }
                ]
            },
            {
                cat: "🥗 Healthy Eats", items: [
                    { n: "Greek Salad", p: 45 }, { n: "Chicken Salad", p: 60 },
                    { n: "Mogodu (Tripe) with Samp/Pap", p: 70 }, { n: "Manqina (Hooves) with Samp/Pap", p: 60 },
                    { n: "Hard Body Chicken with Samp/Pap", p: 70 }, { n: "Isibindi (Liver) with Pap", p: 60 }
                ]
            },
            {
                cat: "☕ Hot Beverages", items: [
                    { n: "Tea / Coffee", p: 15 }, { n: "Mocha / Cappuccino / Choc", p: 20 }
                ]
            },
            {
                cat: "🍪 Scones & Biscuits", items: [
                    { n: "Scones (Packet)", p: 12 }, { n: "Biscuits (Packet)", p: 15 },
                    { n: "Scones (5 Litre)", p: 150 }, { n: "Biscuits (5 Litre)", p: 180 },
                    { n: "Scones (10 Litre)", p: 300 }, { n: "Biscuits (10 Litre)", p: 350 },
                    { n: "Scones (20 Litre)", p: 600 }, { n: "Biscuits (20 Litre)", p: 700 }
                ]
            }
        ];

        let cart = {};

        function initMenu() {
            const div = document.getElementById('menu-sections');
            fullMenu.forEach(section => {
                let html = `<h2>${section.cat}</h2>`;
                section.items.forEach(item => {
                    html += `<div class="item">
                    <span class="item-name">${item.n}</span>
                    <span class="price">R${item.p}</span>
                    <button class="add-btn" onclick="addToCart('${item.n.replace(/'/g, "\\'")}', ${item.p})">+</button>
                </div>`;
                });
                div.innerHTML += html;
            });
        }

        function addToCart(name, price) {
            if (cart[name]) { cart[name].qty += 1; }
            else { cart[name] = { price: price, qty: 1 }; }
            renderCart();
        }

        function renderCart() {
            const list = document.getElementById('cart-items-list');
            const totalSpan = document.getElementById('total-val');
            list.innerHTML = '';
            let total = 0;
            for (const [name, info] of Object.entries(cart)) {
                total += info.price * info.qty;
                list.innerHTML += `<div class="cart-row"><span>${info.qty}x ${name}</span><span>R${(info.price * info.qty).toFixed(2)}</span></div>`;
            }
            totalSpan.innerText = total.toFixed(2);
        }

        function renderCart() {
            const list = document.getElementById('cart-items-list');
            const totalSpan = document.getElementById('total-val');
            list.innerHTML = '';
            let total = 0;

            for (const [name, info] of Object.entries(cart)) {
                total += info.price * info.qty;

                // We add a button with an 'onclick' that passes the item name
                list.innerHTML += `
            <div class="cart-row">
                <span>${info.qty}x ${name}</span>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <span>R${(info.price * info.qty).toFixed(2)}</span>
                    <button class="remove-btn" onclick="removeFromCart('${name.replace(/'/g, "\\'")}')">✕</button>
                </div>
            </div>`;
            }
            totalSpan.innerText = total.toFixed(2);
        }

        function removeFromCart(name) {
            if (cart[name]) {
                if (cart[name].qty > 1) {
                    cart[name].qty -= 1; // Reduce quantity by 1
                } else {
                    delete cart[name]; // Remove item entirely if qty is 1
                }
            }
            renderCart(); // Refresh the UI
        }

        function sendToWhatsApp() {
            const name = document.getElementById('cust-name').value;
            const phone = document.getElementById('cust-phone').value;
            const type = document.getElementById('order-type').value;
            const address = document.getElementById('cust-address').value;
            const time = document.getElementById('order-time').value;
            const items = Object.entries(cart);

            if (!name || !phone) return alert("Please enter your name and phone number.");
            if (items.length === 0) return alert("Your cart is empty!");

            const myWhatsApp = "27780421867";

            // Using Unicode escapes so the emojis NEVER break
            const iconOrder = "\u{1F4CB}";  // 📋
            const iconUser = "\u{1F464}";  // 👤
            const iconPhone = "\u{1F4DE}";  // 📞
            const iconTime = "\u{231A}";   // ⌚
            const iconMap = "\u{1F4CD}";  // 📍
            const iconFood = "\u{1F374}";  // 🍴
            const iconItem = "\u{25AA}\u{FE0F}"; // ▪️
            const iconCash = "\u{1F4B0}";  // 💰

            let msg = `*NEW ORDER: ${type.toUpperCase()}* ${iconOrder}\n`;
            msg += `--------------------------\n`;
            msg += `${iconUser} *Customer:* ${name}\n`;
            msg += `${iconPhone} *Phone:* ${phone}\n`;

            if (time) msg += `${iconTime} *Requested Time:* ${time}\n`;
            if (type === "Delivery" && address) msg += `${iconMap} *Address:* ${address}\n`;

            msg += `--------------------------\n`;
            msg += `${iconFood} *ORDER DETAILS:*\n`;

            let total = 0;
            items.forEach(([itemName, info]) => {
                msg += `${iconItem} ${info.qty} x ${itemName} (R${(info.price * info.qty).toFixed(2)})\n`;
                total += info.price * info.qty;
            });

            msg += `--------------------------\n`;
            msg += `${iconCash} *TOTAL: R${total.toFixed(2)}*`;

            // Encode the entire string for the URL
            const finalLink = `https://wa.me/${myWhatsApp}?text=${encodeURIComponent(msg)}`;

            window.open(finalLink, '_blank');
        }

        initMenu();
    </script>
</body>

</html>
