<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>Mkhulu's on Main - Cart</title>
    <style>
        /* ================= LAYOUT & BASE ================= */
        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
            background: #111;
            color: #fff;
            transition: 0.3s;
        }

        /* Desktop: Give space for the fixed cart */
        @media (min-width: 901px) {
            body {
                padding-right: 420px;
            }
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .brand-header,
        .emenu {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 5px;
            color: #F6EDBF;
        }

        .logo {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: contain;
        }

        .logo-link {
            display: flex;
            align-items: center;
            gap: 15px;
            text-decoration: none;
            color: inherit;
        }

        /* ================= FIXED SIDE CART (DRAWER) ================= */
        #cart-pnl {
            position: fixed;
            top: 0;
            right: 0;
            width: 420px;
            height: 100vh;
            background: #1c1c1c;
            box-shadow: -8px 0 30px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            z-index: 2000;
            border-left: 2px solid #ffbb00;
            transition: transform 0.3s ease-in-out;
        }

        /* Mobile specific cart styling */
        @media (max-width: 900px) {
            #cart-pnl {
                width: 100%;
                transform: translateX(100%);
                /* Hidden by default on mobile */
            }

            #cart-pnl.open {
                transform: translateX(0);
                /* Slide in */
            }
        }

        .cart-header {
            padding: 20px;
            font-size: 1.4rem;
            font-weight: 700;
            background: #111;
            border-bottom: 1px solid #333;
            color: #ffbb00;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Close button for mobile cart */
        .close-cart {
            display: none;
            background: none;
            border: none;
            color: #ffbb00;
            font-size: 1.5rem;
            cursor: pointer;
        }

        @media (max-width: 900px) {
            .close-cart {
                display: block;
            }
        }

        @media (max-width: 480px) {
            .menu-buttons1 {
                display: flex;
                /* Align buttons in a row */
                overflow-x: auto;
                /* Enable horizontal scrolling */
                white-space: nowrap;
                /* Prevent buttons from wrapping to a new line */
                gap: 10px;
                /* Space between buttons */
                padding: 10px 5px;
                /* Optional: padding for the container */

                /* Optional: Hides scrollbar for a cleaner look on some browsers */
                -ms-overflow-style: none;
                /* IE and Edge */
                scrollbar-width: none;
                /* Firefox */
            }

            /* Optional: Hides scrollbar for Chrome, Safari, and Opera */
            .menu-buttons1::-webkit-scrollbar {
                display: none;
            }

            .menu-btn1 {
                flex: 0 0 auto;
                /* Prevents buttons from shrinking */
                padding: 10px 15px;
                /* Better touch target size */
                font-size: 14px;
                /* Slightly larger for readability */
                width: auto;
                /* Allows width to fit the text/emoji */
            }
        }

        #cart-items-list {
            flex: 1;
            overflow-y: auto;
            padding: 15px 20px;
        }

        /* ================= FLOATING MOBILE CART BUTTON ================= */
        #mobile-cart-btn {
            display: none;
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #ffbb00;
            color: #111;
            padding: 15px 25px;
            border-radius: 50px;
            font-weight: bold;
            border: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            z-index: 1500;
            cursor: pointer;
        }

        @media (max-width: 900px) {
            #mobile-cart-btn.visible {
                display: flex;
                align-items: center;
                gap: 10px;
            }
        }

        /* ================= FLOATING MOBILE CART BUTTON ================= */
        #mobile-cart-btn {
            display: none;
            /* Hidden until items are added */
            position: fixed;
            bottom: 25px;
            right: 20px;
            /* Brand Gradient: Gold to Orange */
            background: linear-gradient(135deg, #ffbb00, #e67e22);
            color: #111;
            padding: 16px 24px;
            border-radius: 50px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 2px solid #111;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
            z-index: 1500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        /* Attention-grabbing pulse animation */
        @keyframes cart-pulse {
            0% {
                transform: scale(1);
                box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
            }

            50% {
                transform: scale(1.05);
                box-shadow: 0 15px 25px rgba(255, 187, 0, 0.4);
            }

            100% {
                transform: scale(1);
                box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
            }
        }

        @media (max-width: 900px) {
            #mobile-cart-btn.visible {
                display: flex;
                align-items: center;
                gap: 12px;
                animation: cart-pulse 2s infinite ease-in-out;
            }
        }

        #mobile-cart-btn:active {
            transform: scale(0.9);
        }

        #mobile-cart-count {
            background: #111;
            color: #ffbb00;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.9rem;
        }

        /* ================= MENU & ITEMS ================= */
        .menu-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin: 20px 0;
        }

        .menu-btn {
            background: #ffbb00;
            color: #111;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }

        .menu-btn1 {
            background: #FEBB01;
            color: #111;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: bold;
            cursor: s-resize;
            flex-wrap: nowrap;
            overflow-x: auto;
        }

        .menu-btn1:hover {
            background: #FEBB01;
            color: #ffffff;

        }

        /* Container for the buttons */
        .menu-buttons {
            display: flex;
            flex-wrap: nowrap;
            overflow-x: auto
                /* Allows buttons to move to next line on small screens */
                justify-content: center;
            gap: 10px;
            /* Even spacing between buttons */
            margin-bottom: 20px;
            padding: 0 10px;
        }

        /* Individual Button Styling */
        .menu-btn {
            padding: 10px 20px;
            border: none;
            background: #e67e22;
            color: white;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            flex: 1 1 auto;
            /* Buttons grow to fill space but keep their shape */
            max-width: 150px;
            /* Prevents buttons from getting too huge on desktop */
        }

        /* The Menu Content Area */
        #menu-sections {
            width: 100%;
            max-width: 800px;
            /* Limits size on desktop for readability */
            margin: 0 auto;
            /* Centers the menu */
            text-align: center;
        }

        /* THE CRITICAL FIX: Ensures images fit the screen */
        #menu-sections img {
            max-width: 100%;
            /* Image will never be wider than the phone */
            height: auto;
            /* Maintains aspect ratio (no stretching) */
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
        }

        h2 {
            margin-top: 30px;
            color: #F6EDBF;
            border-bottom: 2px solid #ffbb00;
            display: inline-block;
        }

        h4 {
            margin-top: 30px;
            color: #F6EDBF;
            border-bottom: 2px solid #ffbb00;
            display: inline-block;
            object-position: center;
        }

        /* The main row container */
        .item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fff;
            color: #111;
            margin-bottom: 12px;
            padding: 12px 20px;
            border-radius: 50px;
            /* Makes it a pill shape like your image */
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        /* Left side: The food name */
        .item-name {
            flex: 1;
            text-align: left;
            font-weight: 400;
        }



        /* Right side: The button container */
        .btn-wrapper {
            flex: 1;
            text-align: right;
            display: flex;
            justify-content: flex-end;
        }

        /* The yellow button styling */
        .add-btn {
            background-color: #ffc107;
            /* The yellow from your image */
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }

        .add-btn:hover {
            transform: scale(1.1);
        }

        .add-btn {
            background: #ffbb00;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Checkout Form Styling */
        .checkout-section {
            padding: 15px;
            background: #222;
            border-top: 1px solid #333;
        }

        .details-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .details-form input,
        .details-form select,
        .details-form textarea {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #1c1c1c;
            color: #fff;
            width: 100%;
            box-sizing: border-box;
        }

        .full-width {
            grid-column: span 2;
        }

        .btn-whatsapp {
            background: #25D366;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 40px;
            font-weight: 700;
            width: 100%;
            cursor: pointer;
        }

        .total-display {
            display: flex;
            justify-content: space-between;
            font-weight: 700;
            color: #ffbb00;
            margin-top: 10px;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 3000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            padding-top: 50px;
        }

        .modal-content {
            margin: auto;
            display: block;
            width: 80%;
            max-width: 700px;
            border-radius: 10px;
        }

        .close {
            position: absolute;
            top: 15px;
            right: 35px;
            color: #f1f1f1;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Remove Btn */
        .remove-btn {
            background: #ff4444;
            color: white;
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
        }

        .cart-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #333;
        }

        /* 2. STYLING */
        #back-to-top {
            position: fixed;
            bottom: 20px;
            left: 20px;
            font-size: 45px;
            /* Size for Desktop */
            color: #5f6368;
            cursor: pointer;
            z-index: 9999;
            /* Ensures it stays on top of everything */
            transition: all 0.3s ease;
            opacity: 0;
            /* Hidden initially */
            display: none;
            /* Removed from flow initially */
        }

        /* When the 'show' class is added via JS */
        #back-to-top.show {
            opacity: 1;
            display: block;
        }

        #back-to-top:hover {
            color: #E67D22;
            /* Changes to green on hover to match your 'Open' status */
            transform: scale(1.1);
        }

        /* MOBILE VIEW */
        @media (max-width: 600px) {
            #back-to-top {
                font-size: 32px;
                /* Smaller for mobile */
                bottom: 15px;
                left: 15px;
            }
        }

        html {
            scroll-behavior: smooth;
        }

        /* Optional: adds some space above the title when you scroll to it */
        #menu-sections h2 {
            scroll-margin-top: 20px;
            padding-top: 10px;
        }
    </style>
</head>

<body>

    <div id="back-to-top" onclick="scrollToTop()">
        <i class="bi bi-arrow-up-circle-fill"></i>
    </div>

    <div class="container">
        <div class="brand-header">
            <a href="index.html" class="logo-link">
                <img src="images/LOGO.avif" alt="Logo" class="logo">
                <h1>Mkhulu's on main</h1>
            </a>
        </div>



        <section>
            <h1 class="emenu">Explore Our Amazing Menus</h1>
            <h4>Click to view our menu</h4>
            <div class="menu-buttons">
                <button class="menu-btn" onclick="showMenu('images/menu.jpg')">Menu</button>
                <button class="menu-btn" onclick="showMenu('images/hott.png')">Hot Bev</button>
                <button class="menu-btn" onclick="showMenu('images/fat.jpg')">Spaykos</button>
                <button class="menu-btn" onclick="showMenu('images/pizza.png')">Pizza</button>
            </div>
            <Div>
                <h4>Click to Scoll quickly to your category/section</h4>
            </Div>
            <div class="menu-buttons1">
                <button class="menu-btn1" onclick="scrollToCategory('Spaykos')">🌯 Spaykos</button>
                <button class="menu-btn1" onclick="scrollToCategory('Pizza')">🍕 Pizza</button>
                <button class="menu-btn1" onclick="scrollToCategory('Burgers')">🍔 Burgers</button>
                <button class="menu-btn1" onclick="scrollToCategory('Grills')">🥩 Grills</button>
                <button class="menu-btn1" onclick="scrollToCategory('Healthy')">🥗 Healthy</button>
                <button class="menu-btn1" onclick="scrollToCategory('Hot')">☕ Hot Bev</button>
                <button class="menu-btn1" onclick="scrollToCategory('Scones')">🍪 Scones</button>
            </div>
            <div id="menu-sections"></div>
        </section>
    </div>



    <button id="mobile-cart-btn" onclick="toggleCart()">
        🛒 View Order (<span id="mobile-cart-count">0</span>)
    </button>

    <div id="cart-pnl">
        <div class="cart-header">
            <span>🛒 Your Order</span>
            <button class="close-cart" onclick="toggleCart()">✕</button>
        </div>
        <div id="cart-items-list"></div>

        <div class="checkout-section">
            <div class="details-form">
                <input type="text" id="cust-name" placeholder="Name & Surname *" required>
                <input type="tel" id="cust-phone" placeholder="Phone Number *" required>
                <select id="order-type" required>
                    <option disabled selected>Delivery or Collection?</option>
                    <option value="Collection">Collection</option>
                    <option value="Delivery">Delivery</option>
                </select>
                <input type="time" id="order-time">
                <input type="text" id="cust-address" class="full-width" placeholder="Delivery Address">
                <textarea id="special-note" class="full-width" placeholder="Instructions..." rows="2"></textarea>
            </div>

            <div class="total-display">
                <span>Total</span>
                <span>R<span id="total-val">0.00</span></span>
            </div>
            <button class="btn-whatsapp" onclick="sendToWhatsApp()" style="margin-top:10px;">🚀 Send via
                WhatsApp</button>
        </div>
    </div>

    <div id="menuModal" class="modal">
        <span class="close" onclick="closeMenu()">&times;</span>
        <img class="modal-content" id="menuImage">
    </div>

    <script>
        const fullMenu = [
            { cat: "🌯 Spaykos & Amagwinya", items: [{ n: "Small Spaykos", p: 15 }, { n: "Medium Spaykos", p: 40 }, { n: "Large Spaykos", p: 80 }, { n: "Mkhulu’s Spaykos", p: 120 }, { n: "Regular Gwinya (Small)", p: 1 }, { n: "Regular Gwinya (Small + Mince)", p: 3 }, { n: "Regular Gwinya (Big)", p: 7 }, { n: "Regular Gwinya (Big + Mince)", p: 10 }] },
            { cat: "🍕 Pizza", items: [{ n: "Chicken Pizza (M)", p: 70 }, { n: "Chicken Pizza (L)", p: 120 }, { n: "Salami Pizza (M)", p: 70 }, { n: "Salami Pizza (L)", p: 120 }, { n: "Hawaiian Pizza (M)", p: 70 }, { n: "Hawaiian Pizza (L)", p: 120 }, { n: "Beef Pizza (M)", p: 80 }, { n: "Beef Pizza (L)", p: 140 }, { n: "Vegetarian Pizza (M)", p: 60 }, { n: "Vegetarian Pizza (L)", p: 100 }, { n: "Extra Cheese", p: 15 }] },
            { cat: "🍔 Burgers & Fast Food", items: [{ n: "Fatcake Burger: Prego", p: 40 }, { n: "Fatcake Burger: Rib", p: 50 }, { n: "Fatcake Burger: Beef", p: 40 }, { n: "Mini Cooper (Russian/Cheese)", p: 40 }, { n: "Range Rover", p: 45 }, { n: "Porsche", p: 50 }, { n: "Audi RS7", p: 60 }, { n: "Lamborghini", p: 70 }, { n: "Bugatti", p: 75 }, { n: "Rolls Royce", p: 90 }] },
            { cat: "🥩 Grills & Mains", items: [{ n: "Oxtail with Mash/Rice", p: 160 }, { n: "Beef Stew with Samp/Pap", p: 80 }, { n: "Chicken Fillet with Chips/Salad", p: 80 }, { n: "Lamb Chop with Chips/Veg", p: 120 }, { n: "Steak with Chips/Veg", p: 120 }, { n: "400g Sparerib and Chips", p: 120 }, { n: "1kg Sparerib and Chips", p: 200 }, { n: "4 Buffalo Wings & Chips", p: 110 }, { n: "8 Crumbed Wings & Chips", p: 110 }] },
            { cat: "🥗 Healthy Eats", items: [{ n: "Greek Salad", p: 45 }, { n: "Chicken Salad", p: 60 }, { n: "Mogodu (Tripe) with Samp/Pap", p: 70 }, { n: "Manqina (Hooves) with Samp/Pap", p: 60 }, { n: "Hard Body Chicken with Samp/Pap", p: 70 }, { n: "Isibindi (Liver) with Pap", p: 60 }] },
            { cat: "☕ Hot Beverages", items: [{ n: "Tea / Coffee", p: 15 }, { n: "Mocha / Cappuccino / Choc", p: 20 }] },
            { cat: "🍪 Scones & Biscuits", items: [{ n: "Scones (Packet)", p: 12 }, { n: "Biscuits (Packet)", p: 15 }, { n: "Scones (5 Litre)", p: 150 }, { n: "Biscuits (5 Litre)", p: 180 }, { n: "Scones (10 Litre)", p: 300 }, { n: "Biscuits (10 Litre)", p: 350 }, { n: "Scones (20 Litre)", p: 600 }, { n: "Biscuits (20 Litre)", p: 700 }] }
        ];

        let cart = {};

        function initMenu() {
            const div = document.getElementById('menu-sections');
            fullMenu.forEach(section => {
                let html = `<h2>${section.cat}</h2>`;
                section.items.forEach(item => {
                    // Updated HTML structure with three distinct parts
                    html += `<div class="item">
                <span class="item-name">${item.n}</span>
                <span class="price-center">R${item.p}</span>
                <div class="btn-wrapper">
                    <button class="add-btn" onclick="addToCart('${item.n.replace(/'/g, "\\'")}', ${item.p})">+</button>
                </div>
            </div>`;
                });
                div.innerHTML += html;
            });
        }

        function toggleCart() {
            document.getElementById('cart-pnl').classList.toggle('open');
        }

        function addToCart(name, price) {
            if (cart[name]) { cart[name].qty += 1; }
            else { cart[name] = { price: price, qty: 1 }; }
            renderCart();

            // Show mobile button when first item is added
            document.getElementById('mobile-cart-btn').classList.add('visible');
        }

        function removeFromCart(name) {
            if (cart[name].qty > 1) { cart[name].qty -= 1; }
            else { delete cart[name]; }
            renderCart();

            if (Object.keys(cart).length === 0) {
                document.getElementById('mobile-cart-btn').classList.remove('visible');
                document.getElementById('cart-pnl').classList.remove('open');
            }
        }

        function renderCart() {
            const list = document.getElementById('cart-items-list');
            const totalSpan = document.getElementById('total-val');
            const mobileCount = document.getElementById('mobile-cart-count');
            list.innerHTML = '';
            let total = 0;
            let count = 0;

            for (const [name, info] of Object.entries(cart)) {
                total += info.price * info.qty;
                count += info.qty;
                list.innerHTML += `
                    <div class="cart-row">
                        <span>${info.qty}x ${name}</span>
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <span>R${(info.price * info.qty).toFixed(2)}</span>
                            <button class="remove-btn" onclick="removeFromCart('${name.replace(/'/g, "\\'")}')">✕</button>
                        </div>
                    </div>`;
            }
            totalSpan.innerText = total.toFixed(2);
            mobileCount.innerText = count;
        }

        function sendToWhatsApp() {
            const name = document.getElementById('cust-name').value;
            const phone = document.getElementById('cust-phone').value;
            const type = document.getElementById('order-type').value;
            const items = Object.entries(cart);

            if (!name || !phone || type === "Delivery or Collection?") return alert("Please fill in Name, Phone, and Order Type.");
            if (items.length === 0) return alert("Your cart is empty!");

            let msg = `*NEW ORDER: ${type.toUpperCase()}*\nCustomer: ${name}\nPhone: ${phone}\n---\n`;
            items.forEach(([itemName, info]) => {
                msg += `- ${info.qty} x ${itemName} (R${(info.price * info.qty).toFixed(2)})\n`;
            });
            msg += `---\n*TOTAL: R${document.getElementById('total-val').innerText}*`;

            window.open(`https://wa.me/27780421867?text=${encodeURIComponent(msg)}`, '_blank');
        }

        function showMenu(src) {
            const modal = document.getElementById("menuModal");
            document.getElementById("menuImage").src = src;
            modal.style.display = "block";
        }
        function closeMenu() { document.getElementById("menuModal").style.display = "none"; }
        window.onclick = function (e) { if (e.target == document.getElementById("menuModal")) closeMenu(); }

        // Monitor the scroll position
        window.addEventListener('scroll', function () {
            const btn = document.getElementById("back-to-top");
            // Show button after scrolling 200px
            if (window.pageYOffset > 200) {
                btn.style.display = "block";
                // Small timeout to allow the fade-in effect
                setTimeout(() => { btn.classList.add("show"); }, 10);
            } else {
                btn.classList.remove("show");
                setTimeout(() => {
                    if (!btn.classList.contains('show')) btn.style.display = "none";
                }, 300);
            }
        });

        // Smooth scroll logic
        function scrollToTop() {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        }

        function initMenu() {
            const div = document.getElementById('menu-sections');
            fullMenu.forEach(section => {
                // Create a simplified ID (e.g., "Pizza" or "Spaykos")
                const sectionId = section.cat.split(' ')[1] || section.cat;

                let html = `<h2 id="cat-${sectionId}">${section.cat}</h2>`; // Added ID here
                section.items.forEach(item => {
                    html += `<div class="item">
                <span class="item-name">${item.n}</span>
                <span class="price-center">R${item.p}</span>
                <div class="btn-wrapper">
                    <button class="add-btn" onclick="addToCart('${item.n.replace(/'/g, "\\'")}', ${item.p})">+</button>
                </div>
            </div>`;
                });
                div.innerHTML += html;
            });
        }

        function scrollToCategory(id) {
            const element = document.getElementById('cat-' + id);
            if (element) {
                element.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        initMenu();
    </script>
