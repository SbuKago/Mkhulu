<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mkhulu's On Main | Contact</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="styles.css" rel="stylesheet">

    <style>
        /* -------------------- Contact Page Styles -------------------- */
        .contact-section {
            padding: 80px 20px;
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .contact-container {
            width: 100%;
            max-width: 600px;
            background: #1c1c1c;
            padding: 40px;
            border-radius: 15px;
            border: 1px solid #333;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .contact-container h1 {
            text-align: center;
            color: #F6EDBF;
            margin-bottom: 10px;
            font-size: 2.5rem;
        }

        .input-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .contact-form input,
        .contact-form select,
        .contact-form textarea {
            width: 100%;
            padding: 12px 15px;
            margin: 10px 0;
            background: #111;
            border: 1px solid #444;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            font-family: inherit;
            transition: 0.3s;
        }

        .contact-form input:focus,
        .contact-form select:focus,
        .contact-form textarea:focus {
            outline: none;
            border-color: #F6EDBF;
            box-shadow: 0 0 8px rgba(246, 237, 191, 0.2);
        }

        .contact-form select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-16,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='%23F6EDBF' class='bi bi-chevron-down' viewBox='0 0 16 16'%3E%3Cpath fill-rule='evenodd' d='M1.646 4.646a.5.5 0 0 1 .708 0L8 10.293l5.646-5.647a.5.5 0 0 1 .708.708l-6 6a.5.5 0 0 1-.708 0l-6-6a.5.5 0 0 1 0-.708z'/%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-position: right 15px center;
        }

        #Submitbtn {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            background: #F6EDBF;
            color: #8F4526;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s;
        }

        #Submitbtn:hover {
            background: #8F4526;
            color: #F6EDBF;
            transform: translateY(-2px);
        }

        #successMessage {
            animation: fadeIn 0.6s ease-out;
            text-align: center;
            padding: 20px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 600px) {
            .input-group {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .contact-container {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <a href="index.html">
            <img src="images/LOGO.avif" class="logo" alt="Logo">
        </a>

        <div class="hamburger" onclick="toggleMenu()">
            <i class="bi bi-list"></i>
        </div>

        <ul class="nav-links" id="navLinks">
            <li><a href="index.html">Home</a></li>
            <li><a href="menu.html">Menu</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><a href="gallery.html">Gallery</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>

        <a href="menu.html" class="order-btn">
            <i class="bi bi-cart-plus-fill"></i> Order
        </a>
    </nav>

    <div class="contact-section">
        <div class="contact-container">
            <form class="contact-form" id="contactForm">
                <h1>Get in touch</h1>
                <p style="text-align: center; color: #ccc; margin-bottom: 20px;">We'd love to hear your feedback or
                    suggestions!</p>

                <div class="input-group">
                    <input type="text" id="name" placeholder="Name" required>
                    <input type="text" id="surname" placeholder="Surname" required>
                </div>

                <input type="tel" id="phone" placeholder="+27 78 123 4567">

                <select id="subject" required>
                    <option value="" disabled selected>Please select your subject</option>
                    <option value="suggestion">Suggestion</option>
                    <option value="compliment">Compliment</option>
                    <option value="complaint">Complaint</option>
                </select>

                <input type="email" id="email" placeholder="Example@mkhulu.co.za" required>

                <textarea id="message" placeholder="Please type your message here" rows="5" required></textarea>

                <button type="submit" id="Submitbtn">Submit</button>
            </form>

            <div id="successMessage" style="display: none;">
                <i class="bi bi-check-circle-fill" style="font-size: 4rem; color: #F6EDBF;"></i>
                <h2 style="color: #F6EDBF; margin-top: 20px;">Message Sent!</h2>
                <p style="color: #ccc; margin-bottom: 20px;">Thanks for reaching out. We'll get back to you soon.</p>
                <button onclick="location.reload()" class="order-btn"
                    style="border:none; cursor:pointer; display:inline-flex;">Send Another</button>
            </div>
        </div>


    </div>
    </div>

    <div class="social-container">
        <h3>Follow Mkhulu's On Main</h3>
        <div class="social-icons">
            <a href="https://www.facebook.com/mkhulusfastfood/" target="_blank" class="social-btn facebook"
                aria-label="Facebook">
                <i class="fab fa-facebook-f"></i>
            </a>
            <a href="https://www.tiktok.com/@mkhulus.on.main" target="_blank" class="social-btn tiktok"
                aria-label="TikTok">
                <i class="fab fa-tiktok"></i>
            </a>
            <a href="https://www.instagram.com/mkhulusonmain/?hl=en" target="_blank" class="social-btn instagram"
                aria-label="Instagram">
                <i class="fab fa-instagram"></i>
            </a>
        </div>

        <script>
            // Ensure the toggleMenu function exists for mobile
            function toggleMenu() {
                const nav = document.getElementById('navLinks');
                nav.classList.toggle('active');
            }

            // Handle the Form Submission
            document.getElementById('contactForm').addEventListener('submit', function (e) {
                e.preventDefault(); // Stop page from refreshing

                // Hide the form
                document.getElementById('contactForm').style.display = 'none';

                // Show the success message
                const successBox = document.getElementById('successMessage');
                successBox.style.display = 'block';
            });
        </script>
</body>

</html>
