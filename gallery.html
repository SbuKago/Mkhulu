<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Kota Not Found | Mkhulu's On Main</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="styles.css" rel="stylesheet">
    <style>
        .error-container {
            height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .error-code {
            font-size: 8rem;
            font-weight: 800;
            color: #8F4526;
            line-height: 1;
            margin-bottom: 10px;
            text-shadow: 2px 2px 0px #F6EDBF;
        }

        .error-icon {
            font-size: 4rem;
            color: #F6EDBF;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {

            0%,
            20%,
            50%,
            80%,
            100% {
                transform: translateY(0);
            }

            40% {
                transform: translateY(-20px);
            }

            60% {
                transform: translateY(-10px);
            }
        }

        .error-container h2 {
            font-size: 2rem;
            margin-bottom: 15px;
        }

        .error-container p {
            color: #ccc;
            max-width: 500px;
            margin-bottom: 30px;
        }

        .back-home {
            padding: 15px 30px;
            font-size: 1.1rem;
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <a href="index.html">
            <img src="images/LOGO.avif" class="logo" alt="Logo">
        </a>
        <ul class="nav-links">


        </ul>
    </nav>

    <div class="error-container">
        <div class="error-icon">
            <i class="bi bi-patch-question-fill"></i>
        </div>
        <h1 class="error-code">404</h1>
        <h2>Eish! This Kota is missing.</h2>
        <p>It looks like the page you are looking for has been eaten, or it never existed in our kitchen. Let's get you
            back to the main street.</p>

        <a href="index.html" class="cta-btn back-home">
            <i class="bi bi-house-door-fill"></i> Back to Home
        </a>
    </div>

    <footer>
        © 2026 Mkhulu's On Main | Built for Growth 🚀
    </footer>

</body>

</html>
