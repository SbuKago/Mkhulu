<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Kota Not Found | Mkhulu's On Main</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="styles.css" rel="stylesheet">
    <style>
        /* 1. Fix the Page Flow */
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            /* Ensures footer stays at bottom if content is short */
            margin: 0;

            /* 2. Prevent Navbar Overlap */
            .error-container {
                flex: 1;
                /* Pushes the footer to the very bottom */
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                text-align: center;
                padding: 60px 20px;
                /* Increased top padding to clear the navbar */

                /* Changed height to min-height so it expands if text is long */
                min-height: calc(100vh - 150px);
            }

            /* 3. Button and Footer Spacing */
            .back-home {
                margin-top: 20px;
                margin-bottom: 40px;
                /* Forces space between button and footer */
                display: inline-block;
            }

            .error-code {
                font-size: 8rem;
                font-weight: 800;
                color: #8F4526;
                line-height: 1;
                margin-bottom: 10px;
                text-shadow: 2px 2px 0px #F6EDBF;
            }

            .error-icon {
                font-size: 4rem;
                color: #F6EDBF;
                margin-bottom: 20px;
                animation: bounce 2s infinite;
            }

            @keyframes bounce {

                0%,
                20%,
                50%,
                80%,
                100% {
                    transform: translateY(0);
                }

                40% {
                    transform: translateY(-20px);
                }

                60% {
                    transform: translateY(-10px);
                }
            }

            .error-container h2 {
                font-size: 2rem;
                margin-bottom: 15px;
            }

            .error-container p {
                color: #ccc;
                max-width: 500px;
                margin-bottom: 30px;
            }

            .back-home {
                padding: 15px 30px;
                font-size: 1.1rem;
            }

            footer {
                width: 100%;
                padding: 20px;
                background: #000;
                text-align: center;
                margin-top: auto;
                /* Solidifies the footer's position at the bottom */
            }

            /* 4. Mobile Specific Adjustment */
            @media (max-width: 480px) {
                .error-code {
                    font-size: 5rem;
                    /* Smaller text so it doesn't push the footer off-screen */
                }

                .error-container {
                    padding-top: 100px;
                    /* Extra room for the mobile navbar/hamburger */
                }
            }
    </style>
</head>

<body>

    <nav class="navbar">
        <a href="index.html">
            <img src="images/LOGO.avif" class="logo" alt="Logo">
        </a>
        <ul class="nav-links">


        </ul>
    </nav>

    <div class="error-container">
        <div class="error-icon">
            <i class="bi bi-patch-question-fill"></i>
        </div>
        <h1 class="error-code">404</h1>
        <h2>Eish! This Kota is missing.</h2>
        <p>It looks like the page you are looking for has been eaten, or it never existed in our kitchen. Let's get you
            back to the main street.</p>

        <p>Due to <strong><a
                    href="https://mjmattorneys.co.za/blog/photography-rights-in-south-africa-navigating-the-copyright-act-for-photographers-and-subjects/#:~:text=In%20the%20context%20of%20photography,or%20events%20of%20public%20interest.">POPI
                    Act </a></strong>; the owner should provide rights to display pictures.</p>

        <a href="index.html" class="cta-btn back-home">
            <i class="bi bi-house-door-fill"></i> Back to Home
        </a>
    </div>

    <footer>
        © 2026 Mkhulu's On Main | Built for Growth 🚀
    </footer>

</body>
</html>
